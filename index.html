<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>تتریس</title>
<style>
:root{--bg:#0a1230;--panel:#12214f;--line:#2a3f86;--text:#e9eeff;--mute:#8fa0d6;--btn:#1b2f6e;--btn2:#2a46a0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1230}}
:root[data-theme="dark"]{--bg:#0a1230}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;display:flex;flex-direction:column;align-items:center;overflow:hidden;touch-action:none}
.top{display:flex;gap:8px;width:100%;max-width:420px;padding:8px 10px 4px;align-items:stretch}
.box{flex:1;background:var(--panel);border:2px solid var(--line);border-radius:6px;padding:4px 8px;text-align:center}
.box small{display:block;color:var(--mute);font-size:12px}
.box b{font-size:20px;font-variant-numeric:tabular-nums}
.next{flex:0 0 64px;display:flex;align-items:center;justify-content:center;padding:2px}
#nx{width:56px;height:56px}
.stage{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;width:100%;padding:4px 0}
#bd{height:100%;max-height:100%;aspect-ratio:1/2;max-width:92vw;border:3px solid var(--line);border-radius:4px;background:#050a1f;touch-action:none}
.ov{position:absolute;inset:0;display:flex;flex-direction:column;gap:14px;align-items:center;justify-content:center;background:rgba(5,10,31,.82);text-align:center;direction:rtl}
.ov.hide{display:none}
.ov h1{margin:0;font-size:32px}
.ov p{margin:0;color:var(--mute);max-width:260px;line-height:1.7;font-size:14px}
button{font:inherit;color:var(--text);background:var(--btn);border:2px solid var(--line);border-radius:10px;touch-action:none}
button:active{background:var(--btn2)}
button:focus-visible{outline:3px solid #ffd54a;outline-offset:2px}
.main{background:#d6322f;border-color:#ff8a80;padding:12px 32px;font-size:18px;font-weight:700}
.ctl{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;width:100%;max-width:420px;padding:6px 10px 12px}
.ctl button{height:58px;font-size:24px}
@keyframes gw{from{transform:scale(.82);opacity:.5}to{transform:scale(1);opacity:1}}#bd.grow{animation:gw .5s ease-out}@media (prefers-reduced-motion:reduce){#bd.grow{animation:none}}
.tools{flex:0 0 36px;display:flex;flex-direction:column;gap:4px}.tools button{flex:1;min-height:0;font-size:16px;padding:0}
.bar{height:4px;background:#050a1f;border-radius:2px;margin-top:2px}.bar i{display:block;height:100%;width:0;background:#ffd23f;border-radius:2px;transition:width .3s}
.ov ol{margin:0;padding:0;list-style:none;width:min(320px,88vw);max-height:50vh;overflow:auto;touch-action:pan-y}.ov li{display:flex;gap:8px;padding:6px 10px;border-bottom:1px solid var(--line);font-size:15px}.ov li.me{background:var(--btn2);border-radius:6px}.ov li span:nth-child(2){flex:1;text-align:right}
</style>
</head>
<body>
<div class="top">
  <div class="box"><small>امتیاز</small><b id="sc">0</b></div>
  <div class="box"><small>رکورد</small><b id="bs">0</b></div>
  <div class="box"><small id="lb">مرحله</small><b id="lv">1</b><div class="bar"><i id="pg"></i></div></div>
  <div class="box next"><canvas id="nx" width="80" height="80"></canvas></div>
  <div class="tools"><button id="mu" aria-label="قطع و وصل موسیقی">🎵</button><button id="tb" aria-label="جدول رکوردها">🏆</button></div>
</div>
<div class="stage">
  <canvas id="bd" width="300" height="600"></canvas>
  <div class="ov" id="ov">
    <h1 id="ovt">تتریس</h1>
    <p id="ovp">برای حرکت بکشید و برای چرخش لمس کنید. دو ردیف همزمان: بلوک برق می‌آید که ردیف محل افتادنش را پاک می‌کند. سه ردیف یا بیشتر: دینامیت می‌آید که دو ردیف را منفجر می‌کند. با هر مرحله جهانی تازه با صفحهٔ بزرگ‌تر و سرعت بیشتر!</p>
    <button class="main" id="go">شروع بازی</button>
  </div>
</div>
<div class="ov hide" id="lbp"><h1>جدول رکوردها</h1><ol id="lbl"></ol><p id="lbn"></p><button class="main" id="lbx">بستن</button></div>
<div class="ctl">
  <button data-a="left" aria-label="چپ">◀</button>
  <button data-a="right" aria-label="راست">▶</button>
  <button data-a="rot" aria-label="چرخش">⟳</button>
  <button data-a="down" aria-label="پایین">▼</button>
  <button data-a="drop" aria-label="افتادن سریع">⤓</button>
</div>

function initSocial(){if(!window.claude||!claude.use)return;Promise.all([claude.use('db'),claude.use('user')]).then(function(r){DB=r[0];USR=r[1];if(!DB||!USR)return null;return USR.id()}).then(function(id){if(!id||!DB)return;myId=id;var ref=DB.doc('scores/'+id);return ref.get().then(function(s){var rb=s.exists?(+s.data().best||0):0;if(rb>best){best=rb;try{localStorage.setItem('tt_best',best)}catch(e){}hud()}else if(best>rb){ref.set({best:best,level:1}).catch(function(){})}DB.collection('scores').orderBy('best','desc').limit(10).onSnapshot(function(q){lbRows=q.docs.map(function(d){return{id:d.id,best:+d.data().best||0,level:+d.data().level||1}});renderLb()},function(){})})}).catch(function(){})}
var WORLDS=[{n:'دشت مثلث‌ها',b:['#071a3a','#050a1f'],g:'rgba(90,150,255,.18)',a:'#4aa3ff',s:3},{n:'دریای دایره‌ها',b:['#06303a','#031418'],g:'rgba(60,220,220,.16)',a:'#27d9d0',s:0},{n:'کوهستان مکعب‌ها',b:['#2e1a3a','#120a1c'],g:'rgba(220,120,255,.16)',a:'#d77bff',s:4},{n:'جنگل شش‌ضلعی‌ها',b:['#0c2e1a','#04120a'],g:'rgba(90,230,120,.16)',a:'#5ae678',s:6},{n:'کهکشان ستاره‌ها',b:['#3a1a0c','#140804'],g:'rgba(255,170,80,.16)',a:'#ffae50',s:5}];

if(full.length){var gemHit=false;full.slice().forEach(function(y){if(grid[y].some(function(v){return typeof v==='string'&&v.length>1})){gemHit=true;[y-1,y+1].forEach(function(z){if(z>=0&&z<R&&full.indexOf(z)<0&&grid[z].some(function(v){return v}))full.push(z)})}});full.sort(function(a,b){return a-b});crumble(full.length+(spc&&cur.t==='D'?3:0));fx={rows:full,t:0,p:[],gem:gemHit};if(!spc&&full.length>=2){pend=full.length===2?'B':'D';tst={t:0,txt:full.length===2?'⚡ بلوک برق می‌آید!':'💣 دینامیت می‌آید!'}}for(var i=0;i<full.length;i++)for(var x=0;x<C;x++)for(var k=0;k<2;k++)fx.p.push({x:x*S+S/2,y:full[i]*S+S/2,vx:(Math.random()-.5)*7,vy:-Math.random()*6-1,c:COL[(grid[full[i]][x]+'')[0]]||'#fff',l:1});cur=null;return}
hud();timer=0;if(!over)spawn()}
function ghostY(){var y=cur.y;while(!hit(cur.m,cur.x,y+1))y++;return y}
function cell(ctx,x,y,s,col,a){ctx.globalAlpha=a||1;ctx.fillStyle=col;ctx.fillRect(x,y,s,s);var b=Math.max(3,s/6);ctx.fillStyle='rgba(255,255,255,.55)';ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+s,y);ctx.lineTo(x+s-b,y+b);ctx.lineTo(x+b,y+b);ctx.lineTo(x+b,y+s-b);ctx.lineTo(x,y+s);ctx.fill();ctx.fillStyle='rgba(0,0,0,.4)';ctx.beginPath();ctx.moveTo(x+s,y+s);ctx.lineTo(x,y+s);ctx.lineTo(x+b,y+s-b);ctx.lineTo(x+s-b,y+s-b);ctx.lineTo(x+s-b,y+b);ctx.lineTo(x+s,y);ctx.fill();ctx.globalAlpha=1}
function draw(){g.clearRect(0,0,C*S,R*S);g.save();if(fx&&fx.rows.length>=4){var sh=8*(1-Math.min(1,fx.t/450));g.translate((Math.random()-.5)*sh,(Math.random()-.5)*sh)}wBg();g.strokeStyle=W().g;g.lineWidth=1;for(var i=1;i<C;i++){g.beginPath();g.moveTo(i*S,0);g.lineTo(i*S,R*S);g.stroke()}for(i=1;i<R;i++){g.beginPath();g.moveTo(0,i*S);g.lineTo(C*S,i*S);g.stroke()}
for(var y=0;y<R;y++){var cl=fx&&fx.rows.indexOf(y)>=0;for(var x=0;x<C;x++){if(!grid[y][x])continue;var gc=COL[grid[y][x][0]],isg=grid[y][x].length>1;if(cl){var d=Math.abs(x-(C-1)/2)/((C-1)/2);if(fx.t/450>d*.75+.2)continue;cell(g,x*S,y*S,S,gc);if(isg)gm(g,x*S,y*S,S);g.fillStyle='rgba(255,255,255,'+(0.35+0.45*Math.sin(fx.t/30))+')';g.fillRect(x*S,y*S,S,S)}else{cell(g,x*S,y*S,S,gc);if(isg)gm(g,x*S,y*S,S)}}}
if(cur&&!over){var gy=ghostY();for(var r=0;r<cur.m.length;r++)for(var c=0;c<cur.m[r].length;c++)if(cur.m[r][c]){if(gy+r>=0)cell(g,(cur.x+c)*S,(gy+r)*S,S,COL[cur.t],.22);if(cur.y+r>=0){var cx0=(cur.x+c)*S,cy0=(cur.y+r)*S;if(cur.t==='B'||cur.t==='D')sp(g,cx0,cy0,S,cur.t);else cell(g,cx0,cy0,S,COL[cur.t])}}}fxDraw();bnDraw();g.restore()}
function fxDraw(){if(!fx)return;var p=Math.min(1,fx.t/450);for(var i=0;i<fx.rows.length;i++){var y=fx.rows[i]*S;var gr=g.createLinearGradient(0,0,C*S,0);gr.addColorStop(0,'rgba(255,255,255,0)');gr.addColorStop(.5,'rgba(255,255,255,'+(0.9*(1-p))+')');gr.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=gr;g.fillRect(0,y-4*p,C*S,S+8*p)}for(var j=0;j<fx.p.length;j++){var q=fx.p[j];g.globalAlpha=Math.max(0,q.l);g.fillStyle=q.c;g.fillRect(q.x-3,q.y-3,6,6)}g.globalAlpha=1}
function finish(){var f=fx.rows,n=f.length;for(var i=n-1;i>=0;i--)grid.splice(f[i],1);for(i=0;i<n;i++)grid.unshift(new Array(C).fill(0));score+=[0,100,300,500,800,1000,1200,1500][Math.min(n,7)]*level;lines+=n;lvLines+=n;var up=false;while(lvLines>=goalOf(level)){lvLines-=goalOf(level);level++;up=true}if(up){var dd=dims(level);growTo(dd[0],dd[1])}fx=null;hud();timer=0;if(up)levelUp();spawn()}
function drawNext(){ng.clearRect(0,0,80,80);var m=SH[nextT],s=18,w=m[0].length*s,h=m.length*s;for(var r=0;r<m.length;r++)for(var c=0;c<m[r].length;c++)if(m[r][c])cell(ng,(80-w)/2+c*s,(80-h)/2+r*s,s,COL[nextT])}
function speed(){return Math.max(70,800-(level-1)*90)}
function loop(t){if(!last)last=t;var dt=t-last;last=t;if(tst&&!paused){tst.t+=dt;if(tst.t>1800)tst=null}if(banner&&!paused){banner.t+=dt;if(banner.t>1700)banner=null}if(fx&&!paused){var k=dt/16;fx.t+=dt;for(var j=0;j<fx.p.length;j++){var q=fx.p[j];q.x+=q.vx*k;q.vy+=.25*k;q.y+=q.vy*k;q.l-=dt/450}if(fx.t>=450)finish()}else if(running&&!paused){timer+=dt;if(timer>=speed()){timer=0;down(false)}}if(grid)draw();requestAnimationFrame(loop)}
function start(){ac();reset();running=true;paused=false;hide()}
document.getElementById('go').addEventListener('click',function(){if(paused){paused=false;hide()}else start()});
function pause(){if(!running)return;paused=!paused;if(paused)show('توقف','ادامه بدهید یا از اول شروع کنید.','ادامه');else hide()}
var acts={left:function(){move(-1)},right:function(){move(1)},rot:turn,down:function(){down(true)},drop:drop};
var reps={left:1,right:1,down:1};
document.querySelectorAll('[data-a]').forEach(function(b){var a=b.dataset.a,d,iv;
b.addEventListener('pointerdown',function(e){e.preventDefault();acts[a]();if(reps[a]){clearTimeout(d);clearInterval(iv);d=setTimeout(function(){iv=setInterval(acts[a],a==='down'?45:60)},180)}});
['pointerup','pointercancel','pointerleave'].forEach(function(ev){b.addEventListener(ev,function(){clearTimeout(d);clearInterval(iv)})})});
document.addEventListener('keydown',function(e){var k=e.key;if(k==='ArrowLeft')move(-1);else if(k==='ArrowRight')move(1);else if(k==='ArrowUp'||k==='x')turn();else if(k==='ArrowDown')down(true);else if(k===' '){e.preventDefault();drop()}else if(k==='p'||k==='Escape')pause();else return;e.preventDefault()});
var sx,sy,st,acc,moved,pid=null;
bd.addEventListener('pointerdown',function(e){if(!running||paused)return;pid=e.pointerId;bd.setPointerCapture(pid);sx=e.clientX;sy=e.clientY;st=Date.now();acc=0;moved=false});
bd.addEventListener('pointermove',function(e){if(e.pointerId!==pid)return;var cw=bd.getBoundingClientRect().width/C;var dx=e.clientX-sx;var steps=Math.trunc(dx/cw)-acc;if(steps){moved=true;var d=steps>0?1:-1;for(var i=0;i<Math.abs(steps);i++)move(d);acc+=steps}
if(e.clientY-sy>cw*1.2&&Math.abs(dx)<cw*2){moved=true;down(true);sy=e.clientY-cw*0.2}});
bd.addEventListener('pointerup',function(e){if(e.pointerId!==pid)return;pid=null;var dy=e.clientY-sy,dt=Date.now()-st;if(!moved&&dt<250&&Math.abs(e.clientX-sx)<10&&Math.abs(dy)<10)turn();else if(dy>90&&dt<220&&acc===0)drop()});
bd.addEventListener('pointercancel',function(){pid=null});
document.addEventListener('visibilitychange',function(){if(document.hidden&&running&&!paused)pause()});
document.getElementById('mu').addEventListener('click',function(){musicOn=!musicOn;this.textContent=musicOn?'🎵':'🔇';ac()});
document.getElementById('tb').addEventListener('click',function(){if(running&&!paused)pause();renderLb();document.getElementById('lbp').classList.remove('hide')});
document.getElementById('lbx').addEventListener('click',function(){document.getElementById('lbp').classList.add('hide')});
reset();running=false;requestAnimationFrame(loop);initSocial();
})();
